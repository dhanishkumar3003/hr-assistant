[project]
name = "hr-assistant-poc-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.32",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "anthropic>=0.122.0",
    "msal>=1.37.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "bcrypt==4.0.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.4.0",
]
