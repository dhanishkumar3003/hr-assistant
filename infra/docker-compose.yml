services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hr_poc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_pass
      POSTGRES_DB: hr_assistant_poc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hr_assistant_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: hr_poc_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hr_poc_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://hr_user:hr_pass@postgres:5432/hr_assistant_poc
      OLLAMA_BASE_URL: http://ollama:11434
      # Gmail Pub/Sub backend's own Pub/Sub client (separate from the
      # Gmail API OAuth token in email_outreach/token.json) needs its
      # own auth - points at the gcloud ADC file mounted below, written
      # by `gcloud auth application-default login` on the host.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend/app:/app/app
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcloud/application_default_credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hr_poc_frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  ollama_models: